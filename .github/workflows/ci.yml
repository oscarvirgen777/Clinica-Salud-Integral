name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinica_user
          POSTGRES_PASSWORD: clinica_pass
          POSTGRES_DB: clinica_salud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinica_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://clinica_user:clinica_pass@localhost:5432/clinica_salud?schema=public"
      JWT_SECRET: "ci-test-secret"

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Push schema to database
        run: pnpm prisma db push --skip-generate

      - name: Run seed
        run: pnpm prisma db seed

      - name: Run tests
        run: pnpm test   